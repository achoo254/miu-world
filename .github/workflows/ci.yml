name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License + integrity gate
        run: pnpm assets:check
      - name: Content gate
        run: pnpm content:check
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build web app
        run: pnpm --filter @miu/web build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  integration:
    # Same server test files as `check`, against real Postgres instead of PGlite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miu
          POSTGRES_DB: miu
          # Throw-away CI container reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://miu@localhost:5432/miu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server tests on Postgres 17
        run: pnpm vitest run --project node apps/server

  e2e:
    # Parent → child → play journey and the runtime, against the production build + in-memory PGlite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @miu/web exec playwright install --with-deps chromium
      - name: E2E (setup, account, play)
        run: pnpm --filter @miu/web e2e --project setup --project account --project play

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep CE
        run: semgrep scan --config p/typescript --config p/nodejs --error --metrics=off apps packages
