name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly (02:00 Asia/Saigon) and on demand: the E2E job also opens every map and rides every map's
  # longest ride (E2E_ALL_MAPS); pushes only sample them.
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License + integrity gate
        run: pnpm assets:check
      - name: Content gate
        run: pnpm content:check
      - name: Unit tests
        # Every project but `maps`, which has its own job below.
        run: pnpm vitest run --project node --project web
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build web app
        run: pnpm --filter @miu/web build
      - name: No quest answer in the web bundle
        run: pnpm security:dist
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  maps:
    # The tests that generate whole maps again (vitest project `maps`), on a machine of their own so their
    # generation does not wait for the cores of hundreds of other test files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Map generation tests
        # One file at a time: a whole map's generation then has the runner's cores to itself.
        run: pnpm vitest run --project maps --no-file-parallelism

  integration:
    # Same server test files as `check`, against real Postgres instead of PGlite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miu
          POSTGRES_DB: miu
          # Throw-away CI container reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://miu@localhost:5432/miu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server tests on Postgres 17
        run: pnpm vitest run --project node apps/server

  e2e:
    # Every journey except perf, against the production build + in-memory PGlite. A new spec with its
    # own project in playwright.config.ts joins this job without a workflow change. The run is split
    # over four GitHub runners (one worker each); raise `total` when one shard nears its time budget.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @miu/web exec playwright install --with-deps chromium
      - name: E2E (all projects except perf)
        env:
          E2E_ALL_MAPS: ${{ github.event_name != 'push' && github.event_name != 'pull_request' && '1' || '' }}
        run: pnpm --filter @miu/web e2e:ci --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Keep Playwright traces of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep CE
        run: semgrep scan --config p/typescript --config p/nodejs --error --metrics=off apps packages
