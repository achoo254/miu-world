# .65: /etc/nginx/conf.d/miu.conf. Cloudflare (proxied, SSL "full") -> here -> server on loopback
# :8797 of this same host (no tunnel). The Cloudflare real-IP restore is already global
# (hoc-cloud.conf), so $remote_addr is the child's public IP; the API trusts X-Forwarded-For only
# from loopback, which is why the proxy must run on the same host as the server.
# The iPhone/Android app (apps/mobile) reads the game's files from /game-assets/ cross-origin: its page is
# capacitor://localhost (iOS) or https://localhost (Android). /game-assets/ answers every origin with
# `Access-Control-Allow-Origin: *` (never credentials): the files are public and the same for everyone, and one
# answer for all origins is what Cloudflare can cache (it ignores `Vary: Origin`). Nothing else gets a CORS header;
# the API answers the app itself, for exactly the two app origins (apps/server/src/auth/app-cors.ts).
map $uri $miu_asset_cors {
    default "";
    "~^/game-assets/" "*";
}

server {
    listen 80;
    listen [::]:80;
    server_name miu.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miu.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/miu.hoandat.com.access.log;
    error_log  /var/log/nginx/miu.hoandat.com.error.log;

    root /opt/miu/current/apps/web/dist;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Every response that is not the API's carries these headers. They sit in this one `location /` and its nested
    # locations inherit them: nginx drops a parent's add_header wherever a block declares its own, so none of the
    # nested blocks may add a header, and /api/ above stays out on purpose, because the server (helmet) sets its own
    # CSP, HSTS, nosniff, X-Frame-Options and Referrer-Policy and a second copy of each would be sent.
    # The CSP is the one each page already carries in its meta (CONTENT_SECURITY_POLICY in apps/web/vite.config.ts),
    # plus what a meta cannot say: frame-ancestors, and manifest-src for the install manifest. A browser enforces
    # both, so the header must allow everything the meta does; nginx-prod.test.ts holds the two in step.
    # Permissions-Policy: the microphone serves voice chat and the reading recorder; nothing uses camera or location.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        # Empty (no header) except on /game-assets/ (the map above).
        add_header Access-Control-Allow-Origin $miu_asset_cors always;

        try_files $uri $uri/ /index.html;

        # Built files: a miss is a real 404, so a stale chunk after a deploy fails loudly instead of
        # receiving index.html as JavaScript.
        location ~ ^/(assets|game-assets)/ {
            try_files $uri =404;
        }

        # The static lesson pages (dist/bai/<slug>/index.html): a page that does not exist is a real 404 with a page
        # of its own, never index.html, which search engines would take for a page (soft 404). `/bai/` itself has no
        # page.
        location /bai/ {
            try_files $uri $uri/ =404;
            error_page 404 /404.html;
        }
        location = /bai/ {
            return 404;
            error_page 404 /404.html;
        }
        location = /404.html {
            internal;
        }

        # Content type of the web app manifest. (A `types {}` block would replace, not extend, the mime table the
        # server inherits, so the one extra type is given for its file alone.)
        location = /manifest.webmanifest {
            default_type application/manifest+json;
        }
    }
}
