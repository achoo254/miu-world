# .65: /etc/systemd/journald@miu.conf. The API logs to its own journal namespace (LogNamespace=miu in
# miu-server.service), so its retention is Miu's own: at most 14 days, as /privacy promises, without
# changing the host journal that the other projects on .65 share. Read it with
#   journalctl --namespace=miu -u miu-server
[Journal]
Storage=persistent
# One file per day, so whole days age out on time.
MaxFileSec=1day
MaxRetentionSec=14day
