# Lab 176: /etc/nginx/sites-available/miu-staging. Reached only by the tunnel client on loopback.
server {
    listen 127.0.0.1:8090;
    server_name _;

    # The edge (.65) already resolved the Cloudflare client IP into X-Real-IP; trust it only from
    # the local tunnel client, then hand the API that single address (never the client's own XFF).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    root /opt/miu/current/apps/web/dist;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Built files: a miss is a real 404, so a stale chunk after a deploy fails loudly instead of
    # receiving index.html as JavaScript.
    location /assets/ {
        try_files $uri @missing;
    }

    # Game assets keep their path across releases. The tunelo server between the edge and this host
    # caches static files in Redis for 24 h when the name looks hashed ("forest-ch1-tree.png" does)
    # and only skips them on `max-age=0`; s-maxage keeps Cloudflare's 4 h edge cache, which a
    # release clears per URL (docs/deployment-guide.md).
    location /game-assets/ {
        add_header Cache-Control "max-age=0, s-maxage=14400" always;
        try_files $uri @missing;
    }

    # A miss must not be cached: Cloudflare keeps a 404 like any file, so a chunk asked for a moment
    # before its release went live would stay missing after it (docs/deployment-guide.md §6).
    location @missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
