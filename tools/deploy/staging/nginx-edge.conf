# Edge .65: /etc/nginx/conf.d/miu-staging.conf. Cloudflare (proxied, SSL "full") -> here -> tunelo
# server on :3001 -> tunnel "miu-staging" -> lab 176. Same shape as cloudpanel-dev.inet.vn in
# server-tools.conf; the Cloudflare real-IP restore is already global (hoc-cloud.conf).
server {
    listen 80;
    listen [::]:80;
    server_name miu-staging.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miu-staging.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/miu-staging.hoandat.com.access.log;
    error_log  /var/log/nginx/miu-staging.hoandat.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host miu-staging.tunnel.inetdev.io.vn;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
